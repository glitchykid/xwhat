name: Build and release
on:
  push:
    branches: ['main', 'master']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $props = [xml](Get-Content Directory.Build.props -Raw)
          if ($env:RELEASE_TAG -ne ('v' + $props.Project.PropertyGroup.Version)) { throw 'Tag and application version differ' }
      - name: Test and package
        shell: pwsh
        run: ./scripts/Release.ps1
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-release
          path: |
            artifacts/release/*.zip
            artifacts/release/*.sha256
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Publish release with verified build assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'xwhat-release'
          gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name windows-release --dir $directory
          if ($LASTEXITCODE -ne 0) { throw 'Artifact download failed' }
          $assets = @(Get-ChildItem -LiteralPath $directory -File | Select-Object -ExpandProperty FullName)
          $releaseOptions = @()
          if ($env:RELEASE_TAG -like 'v0.*') { $releaseOptions += '--prerelease' }
          gh release create $env:RELEASE_TAG @assets @releaseOptions --repo $env:GITHUB_REPOSITORY --title "X What $env:RELEASE_TAG" --notes-file CHANGELOG.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
